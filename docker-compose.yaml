services:
  postgres:
    image: postgres:17
    container_name: inventory-postgres
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: inventory-api
    container_name: inventory-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://inventory:inventory@postgres:5432/inventory_db?schema=public"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: